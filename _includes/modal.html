<!-- In-browser PDF Drawer (Optional clean slide-over reader) -->
<div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
<aside class="pdf-drawer" id="pdfDrawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
  <div class="drawer-header">
    <div class="drawer-title-group">
      <span class="mono-tag" id="drawerYearTag">1950</span>
      <span class="mono-tag" id="drawerAreaTag">Foundations</span>
      <h3 class="drawer-title" id="drawerTitle">Paper Title</h3>
    </div>
    <div class="drawer-actions">
      <a href="#" id="drawerDirectTab" target="_blank" rel="noopener noreferrer" class="link-btn" title="Open in new window">
        External Window ↗
      </a>
      <a href="#" id="drawerDownloadBtn" download class="link-btn" title="Download PDF file">
        Download
      </a>
      <button class="drawer-close-btn" id="closeDrawerBtn" aria-label="Close reader">✕</button>
    </div>
  </div>
  <div class="drawer-body">
    <iframe id="drawerIframe" src="" title="PDF Document Viewer"></iframe>
  </div>
</aside>

<!-- Toast -->
<div class="site-toast" id="siteToast" role="status" aria-live="polite"></div>
